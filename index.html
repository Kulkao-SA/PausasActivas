<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef4f8, #dcecf5);
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    .contenedor {
        width: 100%;
        max-width: 650px;

        background: white;

        border-radius: 22px;

        padding: 30px 25px;

        text-align: center;

        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
    }

    /* =====================================================
       LOGO
       ===================================================== */

    .logo {
        display: block;

        width: 250px;
        max-width: 75%;

        height: auto;

        margin: 0 auto 18px auto;
    }

    /* =====================================================
       TÍTULO
       ===================================================== */

    h1 {
        margin: 0 0 8px 0;

        color: #1f4e79;

        font-size: 26px;
    }

    .subtitulo {
        color: #666;

        font-size: 15px;

        line-height: 1.4;

        margin-bottom: 18px;
    }

    /* =====================================================
       FECHA
       ===================================================== */

    .fecha {
        display: inline-block;

        background: #f1f5f9;

        color: #555;

        padding: 7px 14px;

        border-radius: 10px;

        font-size: 13px;

        margin-bottom: 18px;
    }

    /* =====================================================
       VIDEO
       ===================================================== */

    .video-box {
        background: #f8fafc;

        border-radius: 15px;

        padding: 20px;

        margin-top: 5px;
    }

    .etiqueta {
        font-size: 11px;

        color: #888;

        text-transform: uppercase;

        letter-spacing: 1px;

        margin-bottom: 8px;
    }

    .video-titulo {
        font-size: 18px;

        font-weight: bold;

        color: #333;

        line-height: 1.35;

        margin-bottom: 18px;
    }

    /* =====================================================
       BOTÓN
       ===================================================== */

    .boton {
        display: inline-block;

        background: #1f73b7;

        color: white;

        text-decoration: none;

        padding: 12px 26px;

        border-radius: 10px;

        font-size: 16px;

        font-weight: bold;

        transition: all 0.2s ease;
    }

    .boton:hover {
        background: #155a91;

        transform: translateY(-2px);

        box-shadow: 0 5px 15px rgba(31, 115, 183, 0.25);
    }

    /* =====================================================
       PIE
       ===================================================== */

    .info {
        margin-top: 18px;

        color: #888;

        font-size: 12px;

        line-height: 1.4;
    }

    /* =====================================================
       CELULARES
       ===================================================== */

    @media (max-width: 600px) {

        .contenedor {
            padding: 25px 18px;
        }

        h1 {
            font-size: 23px;
        }

        .subtitulo {
            font-size: 14px;
        }

        .video-titulo {
            font-size: 17px;
        }

        .boton {
            width: 100%;
            padding: 12px;
            font-size: 15px;
        }
    }

</style>
