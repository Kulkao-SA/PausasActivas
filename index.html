<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pausas Activas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef4f8, #dcecf5);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 650px;

            background: white;

            border-radius: 22px;

            padding: 40px 30px;

            text-align: center;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        /* =====================================================
           LOGO
           ===================================================== */

        .logo {
            display: block;

            width: 280px;
            max-width: 80%;

            height: auto;

            margin: 0 auto 25px auto;
        }

        /* =====================================================
           TÍTULO
           ===================================================== */

        h1 {
            margin: 0 0 10px 0;

            color: #1f4e79;

            font-size: 32px;
        }

        .subtitulo {
            color: #666;

            font-size: 17px;

            line-height: 1.5;

            margin-bottom: 25px;
        }

        /* =====================================================
           FECHA
           ===================================================== */

        .fecha {
            display: inline-block;

            background: #f1f5f9;

            color: #555;

            padding: 10px 18px;

            border-radius: 10px;

            font-size: 15px;

            margin-bottom: 25px;
        }

        /* =====================================================
           VIDEO
           ===================================================== */

        .video-box {
            background: #f8fafc;

            border-radius: 15px;

            padding: 25px;

            margin-top: 10px;
        }

        .etiqueta {
            font-size: 13px;

            color: #888;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin-bottom: 10px;
        }

        .video-titulo {
            font-size: 21px;

            font-weight: bold;

            color: #333;

            line-height: 1.4;

            margin-bottom: 25px;
        }

        /* =====================================================
           BOTÓN
           ===================================================== */

        .boton {
            display: inline-block;

            background: #1f73b7;

            color: white;

            text-decoration: none;

            padding: 15px 32px;

            border-radius: 10px;

            font-size: 18px;

            font-weight: bold;

            transition: all 0.2s ease;
        }

        .boton:hover {
            background: #155a91;

            transform: translateY(-2px);

            box-shadow: 0 5px 15px rgba(31, 115, 183, 0.25);
        }

        /* =====================================================
           PIE
           ===================================================== */

        .info {
            margin-top: 25px;

            color: #888;

            font-size: 13px;

            line-height: 1.5;
        }

        /* =====================================================
           CELULARES
           ===================================================== */

        @media (max-width: 600px) {

            .contenedor {
                padding: 30px 20px;
            }

            h1 {
                font-size: 27px;
            }

            .subtitulo {
                font-size: 15px;
            }

            .video-titulo {
                font-size: 18px;
            }

            .boton {
                width: 100%;
                padding: 14px;
            }
        }

    </style>
</head>


<body>

<div class="contenedor">


    <!-- =====================================================

    // ==========================================================
    // FECHA ACTUAL
    // ==========================================================

    // ==========================================================
    // CALCULAR DÍA DEL AÑO
    //
    // 1 de enero  = 1
    // 2 de enero  = 2
    // ...
    // ==========================================================

    const inicioDelAño =
        new Date(hoy.getFullYear(), 0, 1);

    const diferencia =
        hoy - inicioDelAño;

    const diaDelAño =
        Math.floor(
            diferencia / (1000 * 60 * 60 * 24)
        ) + 1;


    // ==========================================================
    // SELECCIONAR VIDEO
    //
    // Día 1  → Video 1
    // Día 2  → Video 2
    // ...
    // Día 10 → Video 10
    // Día 11 → Video 1
    // ==========================================================

    const indice =
        (diaDelAño - 1) % videos.length;

    const videoSeleccionado =
        videos[indice];


    // ==========================================================
    // MOSTRAR FECHA
    // ==========================================================

    const opcionesFecha = {

        weekday: "long",

        year: "numeric",

        month: "long",

        day: "numeric"

    };

    document.getElementById("fecha").textContent =
        hoy.toLocaleDateString(
            "es-PE",
            opcionesFecha
        );


    // ==========================================================
    // MOSTRAR NOMBRE DEL VIDEO
    // ==========================================================

    document.getElementById(
        "tituloVideo"
    ).textContent =
        videoSeleccionado.titulo;


    // ==========================================================
    // CONFIGURAR BOTÓN
    // ==========================================================

    document.getElementById(
        "botonVideo"
    ).href =
        videoSeleccionado.url;
